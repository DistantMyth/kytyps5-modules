name: Cheat Submission
description: Submit a new cheat file for a PS5 game
title: "[CHEAT]: <Game Name> (<Title ID>)"
labels: ["submission", "cheat"]
body:
  - type: markdown
    attributes:
      value: |
        ### Community Cheat Submission
        Submit a new cheat definition for KytyPS5. A Pull Request will automatically be generated for maintainer review.
  - type: input
    id: title_id
    attributes:
      label: Title ID
      description: Bare uppercase PS5 game Title ID
      placeholder: "e.g. PPSA01325"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game Version
      description: Target game version (e.g. 01.905.000 or 01_905_000)
      placeholder: "01.905.000"
    validations:
      required: true
  - type: input
    id: game_name
    attributes:
      label: Game Name
      description: Human-readable name of the game
      placeholder: "e.g. Astro's Playroom"
    validations:
      required: true
  - type: input
    id: cheat_title
    attributes:
      label: Cheat Title
      description: Brief title of this cheat
      placeholder: "e.g. Infinite Health & Max Coins"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Detailed Description
      description: Explain how to trigger the cheat, key combos, or notes.
      placeholder: "Cheat instructions..."
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: JSON File Attachment
      description: Drag and drop your .json file here, or paste raw JSON.
      placeholder: "Attach your .json file here..."
    validations:
      required: true
