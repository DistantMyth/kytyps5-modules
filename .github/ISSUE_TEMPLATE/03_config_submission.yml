name: Config Submission
description: Submit a recommended configuration preset for a PS5 game
title: "[CONFIG]: <Game Name> (<Title ID>)"
labels: ["submission", "config"]
body:
  - type: markdown
    attributes:
      value: |
        ### Community Config Submission
        Submit a recommended configuration preset for KytyPS5. A Pull Request will automatically be generated for maintainer review.
  - type: input
    id: title_id
    attributes:
      label: Title ID
      description: Bare uppercase PS5 game Title ID
      placeholder: "e.g. PPSA01325"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game Version
      description: Target game version (e.g. 01.905.000 or 01_905_000)
      placeholder: "01.905.000"
    validations:
      required: true
  - type: input
    id: game_name
    attributes:
      label: Game Name
      description: Human-readable name of the game
      placeholder: "e.g. Astro's Playroom"
    validations:
      required: true
  - type: input
    id: config_title
    attributes:
      label: Config Title
      description: Brief title of this configuration preset
      placeholder: "e.g. Optimized Performance Preset (Steam Deck / Lower-end GPUs)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Detailed Description
      description: Explain recommended settings, hardware targets, or known trade-offs.
      placeholder: "Config explanation..."
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: JSON File Attachment
      description: Drag and drop your .json file here. The uploaded link will appear automatically.
      placeholder: "Attach your .json file here..."
    validations:
      required: true
