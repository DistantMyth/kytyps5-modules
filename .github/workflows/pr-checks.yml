name: PR Validation Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test scripts/test/*.test.mjs

      - name: Validate module files
        run: node scripts/validate-modules.mjs

      - name: Verify catalog index is up to date
        run: |
          node scripts/build-index.mjs
          git diff --exit-code index.json index.min.json || (echo "Catalog index is out of date. Please run npm run build:index." && exit 1)
