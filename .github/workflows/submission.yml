name: Process Module Submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: module-submission-pipeline
  cancel-in-progress: false

jobs:
  process:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge submission with reaction
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssue({
              ...context.repo,
              issue_number: context.issue.number,
              content: 'eyes'
            });

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Process submission & write module file
        id: process
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/process-submission.mjs

      - name: Validate module schema & run tests
        run: |
          node --test "scripts/test/**/*.test.mjs"
          node scripts/validate-modules.mjs

      - name: Regenerate catalog index
        run: node scripts/build-index.mjs

      - name: Create or update Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            patches/json/
            cheats/json/
            configs/json/
            index.json
            index.min.json
          commit-message: "${{ steps.process.outputs.pr_title }}"
          branch: "submission/${{ steps.process.outputs.branch_suffix }}"
          title: "${{ steps.process.outputs.pr_title }}"
          body: |
            Automated submission from #${{ github.event.issue.number }} by @${{ steps.process.outputs.author }}.

            - **Category:** ${{ steps.process.outputs.category }}
            - **Title ID:** ${{ steps.process.outputs.title_id }}
            - **Version:** ${{ steps.process.outputs.version }}
            - **File:** `${{ steps.process.outputs.filename }}`
          delete-branch: true

      - name: Auto-merge for Maintainers / Acknowledge Community
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          IS_COLLABORATOR: ${{ steps.process.outputs.is_collaborator }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ -z "$PR_URL" ]; then
            gh issue comment "$ISSUE_NUM" --body "ℹ️ **No changes detected.** The submission matches existing repository content."
            exit 0
          fi

          if [ "$IS_COLLABORATOR" = "true" ] && [ -n "$PR_NUMBER" ]; then
            if gh pr merge "$PR_NUMBER" --auto --squash; then
              gh issue comment "$ISSUE_NUM" --body "✅ **Submission accepted.** PR $PR_URL has been opened and scheduled for auto-merge."
            else
              gh issue comment "$ISSUE_NUM" --body "🚀 **Submission accepted.** PR $PR_URL has been opened. Please review and merge."
            fi
          else
            gh issue comment "$ISSUE_NUM" --body "🚀 **Submission processed.** Pull Request opened: $PR_URL. A maintainer will review and merge it."
          fi

      - name: Post failure comment to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          ERR_MSG="Please review the Title ID format (e.g. \`PPSA01325\`), Version format (e.g. \`01.905.000\`), and ensure the attached file is valid JSON matching your submission details."
          TMP_ERR="/tmp/submission-error.txt"
          if [ -f "$TMP_ERR" ]; then
            ERR_MSG="$(cat "$TMP_ERR")"
          fi
          gh issue comment "$ISSUE_NUM" --body "❌ **Submission failed validation.** $ERR_MSG"
