name: Build Index & Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "cheats/**"
      - "configs/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate all modules
        run: node scripts/validate-modules.mjs

      - name: Generate and minify index
        run: node scripts/build-index.mjs

      - name: Commit updated index if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -n "$(git status --porcelain index.json index.min.json)" ]; then
            git add index.json index.min.json
            git commit -m "chore: synchronize index.json & index.min.json [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp index.json _site/
          cp index.min.json _site/
          cp -r patches _site/ 2>/dev/null || true
          cp -r cheats _site/ 2>/dev/null || true
          cp -r configs _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-sync
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
